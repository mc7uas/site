<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カスタム共有 - ううう</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 16px;
    }

    h1 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #666;
      font-size: 13px;
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 6px;
      color: #444;
    }

    .input-text, .custom-textarea {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
      background-color: #fafafa;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .input-text:focus, .custom-textarea:focus {
      border-color: #06C755;
      background-color: #fff;
    }

    .custom-textarea {
      height: 80px;
      resize: vertical;
      font-family: inherit;
    }

    /* --- LINE風リアルプレビュー --- */
    .chat-container {
      background-color: #7494C0;
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
    }

    .chat-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .chat-bubble {
      background-color: #85E249;
      border-radius: 16px 16px 2px 16px;
      padding: 10px;
      max-width: 85%;
      margin-left: auto;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    .ogp-card {
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }

    .ogp-info {
      padding: 10px 12px;
    }

    .ogp-title {
      font-weight: bold;
      font-size: 14px;
      color: #111;
      margin-bottom: 4px;
      line-height: 1.3;
      word-break: break-all;
    }

    .ogp-desc {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ogp-domain {
      font-size: 10px;
      color: #999;
      margin-top: 6px;
    }

    .share-btn {
      width: 100%;
      padding: 12px;
      background-color: #06C755;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 16px;
    }

    .share-btn:hover {
      background-color: #05b34c;
    }

    .share-msg {
      font-size: 12px;
      color: #2b6cb0;
      text-align: center;
      margin-top: 10px;
      min-height: 18px;
    }

    .btn-back {
      display: block;
      text-align: center;
      color: #666;
      text-decoration: none;
      font-size: 13px;
    }

    .btn-back:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>🔗 OGP共有ジェネレーター</h1>
  <p class="subtitle">タイトルと説明文を自由に入力して共有リンクを作成できます</p>

  <div class="card">
    <!-- タイトル入力 -->
    <div class="form-group">
      <label for="titleInput">題名（タイトル）:</label>
      <input type="text" id="titleInput" class="input-text" value="ううう" oninput="updatePreview()">
    </div>

    <!-- 自由入力フォーム -->
    <div class="form-group">
      <label for="customInput">説明文（ディスクリプション）:</label>
      <textarea id="customInput" class="custom-textarea" placeholder="好きな説明文を入力してください..." oninput="updatePreview()">これはペンです。This is a pen.</textarea>
    </div>

    <!-- LINE風リアルプレビュー -->
    <div class="chat-container">
      <div class="chat-label">💬 LINEカード表示プレビュー</div>
      <div class="chat-bubble">
        <div class="ogp-card">
          <div class="ogp-info">
            <div id="previewTitle" class="ogp-title">ううう</div>
            <div id="previewText" class="ogp-desc">これはペンです。This is a pen.</div>
            <div class="ogp-domain">site-vjjv.onrender.com</div>
          </div>
        </div>
      </div>
    </div>

    <button type="button" class="share-btn" onclick="executeCustomShare()">
      🔗 この内容で共有する（URLのみ送信）
    </button>

    <p id="shareMsg" class="share-msg"></p>
  </div>

  <a href="../" class="btn-back">← トップページに戻る</a>

  <script>
    function updatePreview() {
      const title = document.getElementById('titleInput').value.trim();
      const text = document.getElementById('customInput').value.trim();

      document.getElementById('previewTitle').innerText = title || '（タイトルなし）';
      document.getElementById('previewText').innerText = text || '（説明文なし）';
    }

    function executeCustomShare() {
      const title = document.getElementById('titleInput').value.trim() || 'ううう';
      const text = document.getElementById('customInput').value.trim() || 'これはペンです。This is a pen.';
      const msg = document.getElementById('shareMsg');

      const renderServerUrl = 'https://site-vjjv.onrender.com/share';
      const shareUrl = `${renderServerUrl}?title=${encodeURIComponent(title)}&text=${encodeURIComponent(text)}`;

      const shareData = {
        url: shareUrl
      };

      msg.style.color = '#2b6cb0';
      msg.textContent = '⏳ 共有用URLを準備中...';

      if (navigator.share) {
        navigator.share(shareData)
          .then(() => {
            msg.textContent = '';
          })
          .catch((err) => {
            msg.textContent = '';
            console.log('共有キャンセル', err);
          });
      } else {
        navigator.clipboard.writeText(shareUrl)
          .then(() => {
            msg.style.color = '#38A169';
            msg.textContent = '共有URLをコピーしました！';
            setTimeout(() => { msg.textContent = ''; }, 4000);
          })
          .catch(() => {
            msg.style.color = '#e53e3e';
            msg.textContent = 'コピーに失敗しました。';
          });
      }
    }
  </script>

</body>
</html>
