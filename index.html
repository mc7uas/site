<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ううう</title>

  <!-- OGP（SNS・LINE用プレビュー設定） -->
  <meta property="og:title" content="ううう">
  <meta property="og:description" content="これはペンです。This is a pen.">
  <meta property="og:type" content="website">

  <style>
    /* 全体の基本設定 */
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      color: #333;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }

    /* タイトルなどの見出し */
    h1, h2 {
      margin-bottom: 10px;
    }

    /* アクセスカウンターの枠組み */
    .counter-container {
      margin: 30px 0;
      font-size: 18px;
      font-weight: bold;
    }

    /* 数字部分（黒背景＋緑文字のレトロ風） */
    #count {
      display: inline-block;
      background-color: #111;
      color: #00ff66;
      font-family: 'Courier New', monospace;
      font-size: 24px;
      padding: 4px 12px;
      border-radius: 4px;
      letter-spacing: 3px;
      margin-left: 8px;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.8);
    }

    /* サーバー起動中メッセージ */
    .loading-msg {
      font-size: 13px;
      color: #2b6cb0;
      margin-top: 6px;
      font-weight: normal;
    }

    /* 中央配置の検索フォーム */
    .search-form {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .search-input {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      width: 200px;
    }

    .search-input:focus {
      border-color: #333;
    }

    .search-button {
      padding: 8px 16px;
      font-size: 14px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .search-button:hover {
      background-color: #555;
    }

    /* 注釈テキスト（グレー表示） */
    .note {
      color: #808080;
      margin-top: 40px;
      font-size: 14px;
    }

    /* ナビゲーション・リンクエリア */
    .link-container {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 黒ボタン（お問い合わせなど） */
    .nav-btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .nav-btn:hover {
      background-color: #555;
    }

    /* カスタム共有ページへの誘導エリア */
    .share-area {
      background: #fff;
      padding: 16px 20px;
      border-radius: 6px;
      border: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
    }

    .share-label {
      font-size: 12px;
      font-weight: bold;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- カウンター部分 -->
  <div class="counter-container">
    アクセスカウンター: <span id="count">------</span>
    <p id="loadingMsg" class="loading-msg">⏳ サーバー起動中... 少しお待ちください（約40秒）</p>
  </div>

  <h1>これはペンです。</h1>
  <h2>This is a pen.</h2>

  <!-- 中央配置の検索エリア -->
  <search>
    <div class="search-form">
      <input type="search" id="pageSearchInput" placeholder="検索..." class="search-input" onkeydown="if(event.key==='Enter') searchOnPage()">
      <button type="button" onclick="searchOnPage()" class="search-button">検索</button>
    </div>
  </search>

  <p class="note">ここだけはAIに頼らずに作った。</p>

  <!-- リンク＆共有エリア -->
  <div class="link-container">
    <a href="./contact/" class="nav-btn">お問い合わせはこちら</a>

    <div class="share-area">
      <div class="share-label">好きなタイトル・文章で共有カードを作る</div>
      <a href="./share/" class="nav-btn" style="background-color: #06C755;">🔗 共有ジェネレーターを開く</a>
    </div>
  </div>

  <!-- スクリプト類 -->
  <script>
    // 1. アクセスカウンター処理（スリープ対応）
    fetch('https://site-vjjv.onrender.com/count')
      .then(res => res.json())
      .then(data => {
        // カウント取得成功で数字を表示し、メッセージを消す
        document.getElementById('count').innerText = String(data.visits).padStart(6, '0');
        document.getElementById('loadingMsg').style.display = 'none';
      })
      .catch(err => {
        console.error('取得失敗:', err);
        document.getElementById('loadingMsg').innerText = '❌ カウンター通信エラー';
        document.getElementById('loadingMsg').style.color = '#e53e3e';
      });

    // 2. ページ内検索処理
    function searchOnPage() {
      const input = document.getElementById('pageSearchInput');
      const query = input.value.trim();

      if (!query) return;

      const found = window.find(query);

      if (!found) {
        alert('「' + query + '」は見つかりませんでした！');
      }
    }
  </script>

</body>
</html>
