<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ううう</title>
</head>
<body>

  <p>アクセスカウンター: <span id="count">000000</span></p>
  <h1>これはペンです。</h1>
  <h2>This is a pen.</h2>

  <script>
    fetch('https://site-vjjv.onrender.com/')
      .then(res => res.json())
      .then(data => {
        // Render側が { "value": 1 } で返す設定なら data.value でOKです
        // もし { "visits": 1 } なら data.visits に変更してください
        document.getElementById('count').innerText = String(data.value).padStart(6, '0');
      })
      .catch(err => {
        console.error('取得失敗:', err);
      });
  </script>
</body>
</html>
