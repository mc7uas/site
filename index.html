<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ううう</title>
</head>
<body>

  <p>アクセスカウンター: <span id="count">000000</span></p>
  <h1>これはペンです。</h1>
  <h2>This is a pen.</h2>

  <script>
    // 末尾に /count を追加
    fetch('https://site-vjjv.onrender.com/count')
      .then(res => res.json())
      .then(data => {
        // data.value を data.visits に変更
        document.getElementById('count').innerText = String(data.visits).padStart(6, '0');
      })
      .catch(err => {
        console.error('取得失敗:', err);
      });
  </script>
</body>
</html>
