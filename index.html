<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ううう</title>
  <style>
    /* 全体の基本設定 */
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      color: #333;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }

    /* タイトルなどの見出し */
    h1, h2 {
      margin-bottom: 10px;
    }

    /* アクセスカウンターの枠組み */
    .counter-container {
      margin: 30px 0;
      font-size: 18px;
      font-weight: bold;
    }

    /* 数字部分（黒背景＋緑文字のレトロ風） */
    #count {
      display: inline-block;
      background-color: #111;
      color: #00ff66;
      font-family: 'Courier New', monospace;
      font-size: 24px;
      padding: 4px 12px;
      border-radius: 4px;
      letter-spacing: 3px;
      margin-left: 8px;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <!-- カウンター部分 -->
  <p class="counter-container">
    アクセスカウンター: <span id="count">000000</span>
  </p>

  <h1>これはペンです。</h1>
  <h2>This is a pen.</h2>

  <!-- 通信＆カウント表示のスクリプト -->
  <script>
    fetch('https://site-vjjv.onrender.com/count')
      .then(res => res.json())
      .then(data => {
        document.getElementById('count').innerText = String(data.visits).padStart(6, '0');
      })
      .catch(err => {
        console.error('取得失敗:', err);
      });
  </script>

</body>
</html>
